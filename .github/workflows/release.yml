name: release

# 推 v* 标签时自动构建并发布；也可以在 Actions 页面手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        shell: pwsh
        run: |
          $PSVersionTable | Out-String | Write-Host
          Get-ExecutionPolicy -List | Out-String | Write-Host
          Write-Host ("csc exists: " + (Test-Path "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"))
          Get-ChildItem tools | Select-Object Name | Out-String | Write-Host
          Get-ChildItem tools/wv2 -Recurse -File | Select-Object FullName | Out-String | Write-Host

      # 用 Windows PowerShell 5.1 跑构建：本地就是这么编译的，避免 PowerShell 7
      # 对原生程序参数不同的转义规则影响 csc 的 /r:"..." 与 /resource:"..."
      - name: 编译主程序
        shell: powershell
        run: |
          $text = & powershell -NoProfile -ExecutionPolicy Bypass -File ./tools/build.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          $text | Write-Host
          if ($code -ne 0) {
            $text | Set-Content ci-failure.txt -Encoding utf8
            ("build.ps1 exit code: " + $code) | Add-Content ci-failure.txt
            exit 1
          }

      - name: 打包安装程序
        shell: powershell
        run: |
          $text = & powershell -NoProfile -ExecutionPolicy Bypass -File ./tools/build-installer.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          $text | Write-Host
          if ($code -ne 0) {
            $text | Set-Content ci-failure.txt -Encoding utf8
            ("build-installer.ps1 exit code: " + $code) | Add-Content ci-failure.txt
            exit 1
          }

      - name: 失败时把日志提交回仓库（便于排查，无需 token 读日志）
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path ci-failure.txt)) { "no captured output" | Set-Content ci-failure.txt }
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add ci-failure.txt
          git commit -m "ci: build failure log [skip ci]" | Out-Null
          git push

      - name: 命名产物、生成绿色版、计算校验值
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "0.0.0" }
          New-Item -ItemType Directory -Force dist | Out-Null

          Copy-Item build/WageClockSetup.exe "dist/WageClockSetup-$version.exe"

          # 绿色版：主程序 + 图标资源（不再有前端资源与 WebView2 依赖）
          $portable = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item build/WageClock.exe $portable
          Get-ChildItem build -Filter '*.dll' -File | Copy-Item -Destination $portable -ErrorAction SilentlyContinue
          if (Test-Path build/assets) { Copy-Item build/assets $portable -Recurse }
          Compress-Archive -Path (Join-Path $portable '*') -DestinationPath "dist/WageClock-$version-portable.zip" -CompressionLevel Optimal

          $files = @("WageClockSetup-$version.exe", "WageClock-$version-portable.zip")
          $sums = foreach ($f in $files) {
            $h = (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f"
          }
          $sums | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem dist | Format-Table Name, Length
          Get-Content dist/SHA256SUMS.txt

      - name: 准备发布说明
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $src = "docs/release-notes/$tag.md"
          if (Test-Path $src) { Copy-Item $src release-notes.md }
          else { "## $tag" | Set-Content release-notes.md -Encoding utf8 }

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          name: 工资时钟 ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/WageClockSetup-*.exe
            dist/WageClock-*-portable.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
