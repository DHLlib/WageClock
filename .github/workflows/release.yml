name: release

# 推 v* 标签时自动构建并发布；也可以在 Actions 页面手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译主程序
        shell: pwsh
        run: ./tools/build.ps1

      - name: 打包安装程序（含 WebView2 引导程序）
        shell: pwsh
        run: ./tools/build-installer.ps1

      - name: 命名产物、生成绿色版、计算校验值
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "0.0.0" }
          New-Item -ItemType Directory -Force dist | Out-Null

          Copy-Item build/WageClockSetup.exe "dist/WageClockSetup-$version.exe"

          # 绿色版：主程序 + 依赖 + 前端资源
          $portable = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item build/WageClock.exe $portable
          Get-ChildItem build -Filter '*.dll' -File | Copy-Item -Destination $portable
          Copy-Item build/src, build/assets $portable -Recurse
          Compress-Archive -Path (Join-Path $portable '*') -DestinationPath "dist/WageClock-$version-portable.zip" -CompressionLevel Optimal

          $files = @("WageClockSetup-$version.exe", "WageClock-$version-portable.zip")
          $sums = foreach ($f in $files) {
            $h = (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f"
          }
          $sums | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem dist | Format-Table Name, Length
          Get-Content dist/SHA256SUMS.txt

      - name: 准备发布说明
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $src = "docs/release-notes/$tag.md"
          if (Test-Path $src) {
            Copy-Item $src release-notes.md
          } else {
            "## 工资时钟 $tag`n`n本次变更见下方自动生成的说明。" | Set-Content release-notes.md -Encoding utf8
          }

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          name: 工资时钟 ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/WageClockSetup-*.exe
            dist/WageClock-*-portable.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
