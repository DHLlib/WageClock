<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Wage Clock</title>
<link rel="stylesheet" href="styles/widget.css">
  <script>if (window.chrome && window.chrome.webview) document.documentElement.classList.add("native");</script>
</head>
<body class="dark">
  <div class="card" id="card" data-state="working">
    <header class="top">
      <div class="date" id="date">周三 · 11月12日</div>
      <div class="tools">
        <span class="pill" id="pill"><i class="dot"></i><span id="stateLabel">工作中</span></span>
        <button class="ico" id="pin" title="置顶（Alt+P）" aria-label="置顶">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.6 1.9 14 6.3l-1.9.5-2.4 2.4.3 2.9-3.6-3.6L4 11.9l-.8-.8 3.9-3.9L3.5 3.6l2.9.3L8.8 1.5z"/>
          </svg>
        </button>
        <button class="ico" id="gear" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.48.48 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
        </button>
        <button class="ico close" id="close" title="隐藏" aria-label="隐藏">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M4 4l8 8M12 4l-8 8"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="amount">
      <div class="cap" id="cap">窝囊费已赚</div>
      <div class="money" id="money">
        <span class="cur">¥</span>
        <div class="odo" id="odo" aria-live="off"></div>
      </div>
    </div>

    <div class="track" id="track">
      <div class="track-fill" id="fill"><span class="ember"></span></div>
      <canvas class="sparkler" id="sparkler"></canvas>
      <div class="track-mark" id="mark"></div>
    </div>

    <div class="meta">
      <div class="stat">
        <span class="k">距周末</span>
        <span class="v" id="vWeekend">1天 07:18</span>
      </div>
      <div class="stat mid">
        <span class="k">距下班</span>
        <span class="v big" id="vOff">03:45:00</span>
      </div>
      <div class="stat r">
        <span class="k">本月</span>
        <span class="v" id="fMonth">9/21 天</span>
      </div>
    </div>
  </div>
  <script src="lib/schedule.js"></script>
  <script src="scripts/bridge.js"></script>
  <script src="scripts/widget.js"></script>
</body>
</html>
